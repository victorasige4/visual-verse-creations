name: Temporary Services page interactive visual QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-services-visual-qa.yml']
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install inspection browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify services and seven-stage process
        run: |
          cat > .verify-services.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('services-verification',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const output=[];
          for(const [view,w,h] of [['desktop',1440,900],['tablet',768,1024],['mobile',390,844]]){
            const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1,reducedMotion:'no-preference'});
            const errors=[],missing=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',res=>{if(res.status()===404&&/portfolio|photographer|logo-mark|\.css|\.js/.test(res.url()))missing.push(res.url())});
            try{
              await page.goto('http://127.0.0.1:5173/services.html',{waitUntil:'domcontentloaded',timeout:40000});
              await page.waitForTimeout(1800);
              await page.locator('.vv-sv-hero').screenshot({path:'services-verification/'+view+'-hero.png',animations:'disabled'});
              await page.locator('#service-photography').scrollIntoViewIfNeeded();
              await page.waitForTimeout(900);
              await page.screenshot({path:'services-verification/'+view+'-service-01.png',animations:'disabled'});
              await page.locator('#service-graphic-design').scrollIntoViewIfNeeded();
              await page.waitForTimeout(750);
              await page.screenshot({path:'services-verification/'+view+'-service-03.png',animations:'disabled'});
              const steps=[];
              for(const [id,fraction] of [[0,0],[3,.50],[6,1]]){
                await page.evaluate((f)=>{
                  const section=document.querySelector('#our-process');
                  const rect=section.getBoundingClientRect();
                  const start=window.scrollY+rect.top;
                  const runway=Math.max(1,rect.height-innerHeight);
                  window.scrollTo({top:Math.round(start+runway*f),behavior:'instant'});
                },fraction);
                await page.waitForTimeout(1100);
                const status=await page.evaluate(()=>{
                  const root=document.getElementById('our-process');
                  const stage=root.querySelector('.vv-sp-counter strong');
                  const selected=root.querySelector('.vv-sp-step.is-active .vv-sp-step-content strong');
                  const scene=root.querySelector('.vv-sp-art');
                  const list=Array.from(root.querySelectorAll('.vv-sp-step')).map((el,i)=>{
                    const r=el.getBoundingClientRect();
                    return {i,active:el.classList.contains('is-active'),y:Math.round(r.y)};
                  });
                  return {number:stage?.textContent?.trim(),title:selected?.textContent?.trim(),sceneClass:scene?.className,
                    progress:getComputedStyle(root).getPropertyValue('--vv-sp-progress').trim(),
                    sectionHeight:Math.round(root.getBoundingClientRect().height),steps:list,
                    pageHeight:document.documentElement.scrollHeight,
                    horizontalOverflow:document.documentElement.scrollWidth-innerWidth};
                });
                await page.screenshot({path:'services-verification/'+view+'-process-'+id+'.png',animations:'disabled'});
                steps.push(status);
                if(status.number!==String(id+1).padStart(2,'0'))throw new Error(view+' step '+id+': expected '+(id+1)+' got '+status.number);
                if(status.horizontalOverflow>2)throw new Error(view+' horizontal overflow '+status.horizontalOverflow);
              }
              await page.locator('#before-you-begin').scrollIntoViewIfNeeded();
              await page.waitForTimeout(600);
              await page.screenshot({path:'services-verification/'+view+'-guides.png',animations:'disabled'});
              const data={
                view,headings:await page.locator('.vv-sv-hero h1,.vv-sv-service h2,#vv-sp-title,.vv-sv-resource-heading h2').allTextContents(),
                serviceCount:await page.locator('.vv-sv-service').count(),
                steps,errors,missing
              };
              output.push(data);
              if(data.serviceCount!==6)throw new Error(view+': expected 6 services, got '+data.serviceCount);
              if(errors.length)throw new Error(view+': browser errors '+errors.join(' / '));
              if(missing.length)throw new Error(view+': missing assets '+missing.join(' / '));
              console.log('PASS',view,steps.map(s=>s.number+' '+s.title).join(' | '));
            }catch(error){
              console.error('FAILED',view,String(error));
              fs.writeFileSync('services-verification/'+view+'-error.txt',String(error));
              output.push({view,error:String(error),errors,missing});
              throw error;
            }finally{await page.close();}
          }
          const page=await browser.newPage({viewport:{width:1280,height:900},reducedMotion:'reduce'});
          await page.goto('http://127.0.0.1:5173/services.html',{waitUntil:'domcontentloaded'});
          await page.locator('#our-process').scrollIntoViewIfNeeded();
          await page.waitForTimeout(250);
          const reduced=await page.evaluate(()=>({animation:getComputedStyle(document.querySelector('.vv-sp-launch-circle-ring')).animationName,
            heroHidden:Array.from(document.querySelectorAll('.vv-sv-reveal')).some(el=>getComputedStyle(el).opacity==='0')}));
          output.push({view:'reduced-motion',reduced});
          fs.writeFileSync('services-verification/results.json',JSON.stringify(output,null,2));
          if(reduced.heroHidden)throw new Error('reduced motion has hidden text');
          await browser.close();
          JS
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/services-page-vite.log 2>&1 &
          sleep 3
          node .verify-services.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: services-visual-qa
          path: services-verification/
          retention-days: 3
