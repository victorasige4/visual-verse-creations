name: Temporary Services 3D pins, process motion and shared CTA verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-services-pins-cta.yml']
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify visually, interactively and responsively
        run: |
          cat > .verify-pin-rebuild.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('pin-qa',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const all=[];
          const base='http://127.0.0.1:5173/';
          const pause=t=>new Promise(r=>setTimeout(r,t));
          for(const [view,width,height] of [['desktop',1440,900],['tablet',820,1024],['mobile',390,844]]){
            const page=await browser.newPage({
              viewport:{width,height},
              deviceScaleFactor:1,reducedMotion:'no-preference',
              ...(view==='mobile'?{isMobile:true,hasTouch:true}:{}),
            });
            const errors=[],missing=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',res=>{if(res.status()===404&&/\.(jpg|png|webp|css|js)(\?|$)/.test(res.url()))missing.push(res.url());});
            try{
              await page.goto(base+'services.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1800);
              const ids=['services-top','services','our-process','before-you-begin','lets-create'];
              const order=await page.evaluate(ids=>ids.map(id=>({
                id,top:document.getElementById(id)?.getBoundingClientRect().top+window.scrollY
              })),ids);
              if(order.some(o=>o.top===undefined)||!order.every((o,i)=>i===0||o.top>order[i-1].top))
                throw new Error(view+': incorrect section order '+JSON.stringify(order));
              const cards=page.locator('.vv-sv-service-pin');
              if(await cards.count()!==6) throw new Error(view+': not six 3D cards');
              await page.locator('.vv-sv-hero').screenshot({path:'pin-qa/'+view+'-hero.png',animations:'disabled'});
              await page.locator('.vv-sv-pin-services').scrollIntoViewIfNeeded();
              await page.waitForTimeout(700);
              await page.locator('.vv-sv-pin-services').screenshot({path:'pin-qa/'+view+'-cards.png',animations:'disabled'});
              const cardRects=await cards.evaluateAll(list=>list.map(node=>({
                x:Math.round(node.getBoundingClientRect().x),y:Math.round(node.getBoundingClientRect().y),
                w:Math.round(node.getBoundingClientRect().width),h:Math.round(node.getBoundingClientRect().height),
                href:node.getAttribute('href')
              })));
              if(cardRects.some(c=>!c.href?.includes('request-quote.html')||c.w<180))throw new Error(view+': wrong 3D card target or width');
              let tilt=null;
              if(view!=='mobile'){
                const first=cards.first();
                const before=await first.locator('.vv-pin-platform').evaluate(x=>getComputedStyle(x).transform);
                await first.hover({force:true});
                await page.waitForTimeout(850);
                tilt=await first.locator('.vv-pin-platform').evaluate(x=>getComputedStyle(x).transform);
                if(tilt===before)throw new Error(view+': Aceternity 3D card did not tilt on hover');
                await page.locator('.vv-sv-pin-services').screenshot({path:'pin-qa/'+view+'-pin-hover.png',animations:'allow'});
              }
              const stageResults=[];
              for(const [step,fraction] of [[1,0],[4,.5],[7,1]]){
                await page.evaluate(fraction=>{
                  const el=document.querySelector('#our-process'),rect=el.getBoundingClientRect();
                  const start=window.scrollY+rect.top;
                  const runway=Math.max(1,rect.height-innerHeight);
                  window.scrollTo({top:Math.round(start+runway*fraction),behavior:'instant'});
                },fraction);
                await page.waitForTimeout(1100);
                const state=await page.evaluate(()=>{
                  const el=document.querySelector('#our-process');
                  const scene=el.querySelector('.vv-sp-art');
                  return {current:el.querySelector('.vv-sp-counter strong')?.textContent?.trim(),
                    scene:scene?.className,
                    progress:getComputedStyle(el).getPropertyValue('--vv-sp-progress').trim(),
                    headline:getComputedStyle(el.querySelector('#vv-sp-title')).fontSize,
                    animation:scene?getComputedStyle(scene).animationName:'none',
                    horizontalOverflow:document.documentElement.scrollWidth-innerWidth};
                });
                stageResults.push(state);
                await page.screenshot({path:'pin-qa/'+view+'-process-'+step+'.png',animations:'allow'});
                if(state.current!==String(step).padStart(2,'0'))throw new Error(view+' process step '+step+' failed: '+JSON.stringify(state));
                if(state.horizontalOverflow>2)throw new Error(view+' horizontal overflow '+state.horizontalOverflow);
              }
              const process=page.locator('#our-process');
              const buttons=process.locator('.vv-sp-step-button');
              if(await buttons.count()!==7)throw new Error(view+': process stage count != 7');
              const beforeSection=page.locator('#before-you-begin');
              await beforeSection.scrollIntoViewIfNeeded();
              await page.waitForTimeout(400);
              await beforeSection.screenshot({path:'pin-qa/'+view+'-before.png',animations:'disabled'});
              const cta=page.locator('#lets-create');
              if(await cta.count()!==1)throw new Error(view+': expected exactly one CTA');
              await cta.locator('h2').scrollIntoViewIfNeeded();
              await page.waitForTimeout(290);
              const ctaState=await page.locator('.vv-cta-word').evaluateAll(words=>({
                words:words.length,
                running:words.filter(w=>w.getAnimations().some(a=>a.playState==='running')).length,
                opacityFirst:getComputedStyle(words[0]).opacity
              }));
              await cta.screenshot({path:'pin-qa/'+view+'-cta-during.png',animations:'allow'});
              await page.waitForTimeout(1700);
              await cta.screenshot({path:'pin-qa/'+view+'-cta-final.png',animations:'disabled'});
              const data={view,order,cardRects,tilt,stageResults,ctaState,errors,missing};
              all.push(data);
              console.log('PASS',view,JSON.stringify({cards:cardRects.length,steps:stageResults.map(x=>x.current),cta:ctaState,tilt:!!tilt}));
              if(errors.length)throw new Error(view+': errors '+errors.join(' / '));
              if(missing.length)throw new Error(view+': missing assets '+missing.join(' / '));
            }finally{await page.close();}
          }
          const others=['','about.html','who-we-serve.html','contact.html','request-quote.html','projects.html'];
          for(const entry of others){
            const page=await browser.newPage({viewport:{width:1280,height:900},reducedMotion:'no-preference'});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(base+entry,{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(900);
            const ctaCount=await page.locator('#lets-create').count();
            const words=await page.locator('#lets-create .vv-cta-word').count();
            const legacy=await page.locator('.vv-inner-bottom, .vv-close-cta, .vv-projects-notice').count();
            await page.locator('#lets-create').scrollIntoViewIfNeeded();
            await page.waitForTimeout(1100);
            const background=await page.locator('#lets-create .vv-cta-panel').evaluate(e=>getComputedStyle(e).backgroundImage);
            all.push({other:entry||'home',ctaCount,words,legacy,background,errors});
            if(ctaCount!==1||words<5||legacy||errors.length)throw new Error((entry||'home')+' CTA inconsistent '+JSON.stringify({ctaCount,words,legacy,errors}));
            if(entry===''){await page.locator('#lets-create').screenshot({path:'pin-qa/home-cta.png',animations:'disabled'})}
            if(entry==='projects.html'){await page.locator('#lets-create').screenshot({path:'pin-qa/projects-cta.png',animations:'disabled'})}
            console.log('CTA PASS',entry||'home',words);
            await page.close();
          }
          const reduced=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,reducedMotion:'reduce'});
          await reduced.goto(base+'services.html',{waitUntil:'domcontentloaded'});
          await reduced.locator('#our-process').scrollIntoViewIfNeeded();
          await reduced.waitForTimeout(250);
          const reducedResult=await reduced.evaluate(()=>{
            const root=document.querySelector('#our-process');
            const chart=root.querySelector('.vv-sp-stage-sparks span');
            const word=document.querySelector('.vv-cta-word');
            return {spark:getComputedStyle(chart).animationName,wordOpacity:getComputedStyle(word).opacity};
          });
          all.push({reducedResult});
          if(reducedResult.spark!=='none'||reducedResult.wordOpacity!=='1')throw new Error('Reduced-motion mismatch');
          fs.writeFileSync('pin-qa/results.json',JSON.stringify(all,null,2));
          await browser.close();
          JS
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/pin-qa-vite.log 2>&1 &
          sleep 3
          node .verify-pin-rebuild.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3d-pin-process-cta-qa
          path: pin-qa/
          retention-days: 2
