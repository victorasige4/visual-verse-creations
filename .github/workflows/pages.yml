name: Deploy Visual Verse to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run build
      - name: Adjust page and asset URLs
        run: node scripts/prepare-github-pages.mjs
      - name: Validate all page entrypoints
        run: |
          for name in index projects about services who-we-serve contact request-quote; do
            test -s "dist/$name.html"
          done
          test -s dist/brand-wordmark.png
          test -s dist/logo-mark.png
          grep -q '/visual-verse-creations/assets/' dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
