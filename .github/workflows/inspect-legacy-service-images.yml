name: Temporary source services image inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-legacy-service-images.yml']
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect original Visual Verse imagery
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p legacy-images
          cat > .inspect-legacy-images.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const browser=await chromium.launch();
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const network=[];
          page.on('response',res=>{
            const type=res.headers()['content-type']||'';
            if(type.startsWith('image/'))network.push({status:res.status(),url:res.url(),type});
          });
          await page.goto('https://visual-verse-studio.netlify.app/services',{waitUntil:'domcontentloaded',timeout:48000});
          await page.waitForTimeout(3500);
          const images=await page.evaluate(()=>{
            const result=[];
            for(const el of document.querySelectorAll('img,*')){
              const st=getComputedStyle(el);
              const url=st.backgroundImage;
              if(el.tagName==='IMG'){
                const b=el.getBoundingClientRect();
                result.push({tag:'IMG',src:el.currentSrc,alt:el.alt,w:b.width,h:b.height,parent:el.parentElement?.className?.toString().slice(0,130)});
              } else if(url?.includes('url(')){
                const b=el.getBoundingClientRect();
                if(b.width>100 && b.height>100)result.push({tag:el.tagName,background:url.slice(0,900),w:b.width,h:b.height,cl:typeof el.className==='string'?el.className.slice(0,140):''});
              }
            }
            return result.slice(0,150);
          });
          fs.writeFileSync('legacy-images/inventory.json',JSON.stringify({images,network},null,2));
          console.log(JSON.stringify({images:images.slice(0,40),network:network.slice(0,50)}));
          await browser.close();
          JS
          node .inspect-legacy-images.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-service-images-inventory
          path: legacy-images
          retention-days: 1
