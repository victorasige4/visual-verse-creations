name: Download licensed portrait reference assets
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  prepare-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/download-selected-directions.py
