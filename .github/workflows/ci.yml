name: Reference typography capture
on:
  pull_request:
    branches: [main]
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: cp scripts/capture-heading-reference.mjs /tmp/vv-capture-heading-reference.mjs && git checkout b55fed5628dedb3ca0aa78626df190fb833012aa
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: GITHUB_PAGES=true npm run build && node scripts/prepare-github-pages.mjs
      - run: npm install --no-save --package-lock=false playwright && npx playwright install --with-deps chromium
      - run: cp /tmp/vv-capture-heading-reference.mjs scripts/capture-heading-reference.mjs && node scripts/capture-heading-reference.mjs
