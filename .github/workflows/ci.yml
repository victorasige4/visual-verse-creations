name: Validate React + Tailwind migration

on:
  push:
    branches: [main, feat/react-aceternity-island-navbar, dev/visual-verse-next-batch]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Check homepage assets
        run: |
          test -f dist/index.html
          test -f dist/projects.html
          grep -q vv-portfolio-root dist/index.html
          grep -q vv-projects-page-root dist/projects.html
          test -f dist/brand-wordmark.png
          test -f dist/brand-logo.png
          test -f dist/logo-mark.png
          test -f dist/favicon.ico
          test -f dist/about-photographer.webp
          grep -q vv-about-pixel-root dist/index.html
          grep -q vv-react-nav-root dist/index.html
