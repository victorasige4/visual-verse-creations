name: One-off reference toolbox inspection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reference-toolbox-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect reference and our toolbox
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/vv-inspection-vite.log 2>&1 &
          sleep 3
          cat > .toolbox-inspect.mjs <<'INSPECT'
          import { chromium } from 'playwright';
          import { writeFileSync, mkdirSync } from 'node:fs';
          mkdirSync('toolbox-reference', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const targets = [
            ['potadot', 'https://potadot.com.my/about-us/'],
            ['visual-verse', 'http://127.0.0.1:5173/about.html']
          ];
          for(const [name, url] of targets) {
            for(const [viewport, width, height] of [['desktop', 1440, 1000], ['mobile', 390, 844]]) {
              const page = await browser.newPage({ viewport:{width, height}, deviceScaleFactor:1, reducedMotion:'reduce' });
              try{
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(3800);
                const info = await page.evaluate(() => {
                  const headings=Array.from(document.querySelectorAll('h1,h2,h3,h4'));
                  const hd=headings.find(e=>/Modern tools, picked for each job/i.test(e.textContent||'')) ||
                    headings.find(e=>/The tools change/i.test(e.textContent||'')) ||
                    headings.find(e=>/Our toolbox/i.test(e.textContent||''));
                  const root=document.getElementById('our-toolbox') || hd?.closest('section') || hd?.parentElement?.parentElement?.parentElement;
                  if(!root)return {error:'section not found',h:headings.map(x=>x.textContent?.slice(0,50)).slice(0,25)};
                  root.scrollIntoView({block:'start'});
                  const sectionRect=root.getBoundingClientRect();
                  const els=Array.from(root.querySelectorAll('button,img,svg,[class*="tool"],[class*="Tool"]')).map(el=>{
                    const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                    return {tag:el.tagName,txt:el.textContent?.trim().slice(0,64),
                      class:typeof el.className==='string'?el.className.slice(0,150):'',
                      src:el.getAttribute('src'),alt:el.getAttribute('alt'),
                      title:el.getAttribute('title'),style:el.getAttribute('style'),
                      x:Math.round(r.x-sectionRect.x),y:Math.round(r.y-sectionRect.y),w:Math.round(r.width),h:Math.round(r.height),
                      bg:s.backgroundColor,border:s.borderRadius,boxShadow:s.boxShadow,
                      animation:s.animation,transform:s.transform,
                      display:s.display,position:s.position
                    };
                  }).filter(x=>x.w>0 && x.h>0);
                  return {
                    url:location.href,title:document.title,
                    rootTag:root.tagName,rootClass:root.className,
                    rootHtml:root.outerHTML.slice(0,110000),
                    sectionWidth:sectionRect.width,sectionHeight:sectionRect.height,
                    elements:els
                  };
                });
                writeFileSync('toolbox-reference/'+name+'-'+viewport+'.json',JSON.stringify(info,null,2));
                if(!info.error){
                  const handle=await page.evaluateHandle(() => {
                    const hd=Array.from(document.querySelectorAll('h1,h2,h3,h4')).find(e=>/Modern tools, picked for each job|The tools change/i.test(e.textContent||''));return document.getElementById('our-toolbox') || hd?.closest('section')||null;
                  });
                  if(handle.asElement()) await handle.asElement().screenshot({path:'toolbox-reference/'+name+'-'+viewport+'.png', animations:'disabled',timeout:12000});
                  else await page.screenshot({path:'toolbox-reference/'+name+'-'+viewport+'.png'});
                }else await page.screenshot({path:'toolbox-reference/'+name+'-'+viewport+'.png'});
                console.log(name,viewport,JSON.stringify({url:info.url,error:info.error,elements:info.elements?.length,sectionHeight:info.sectionHeight}));
              }catch(error){writeFileSync('toolbox-reference/'+name+'-'+viewport+'-error.txt',String(error));console.log(name,viewport,'ERROR',String(error));}
              finally{await page.close();}
            }
          }
          await browser.close();
          INSPECT
          node .toolbox-inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: potadot-toolbox-reference
          path: toolbox-reference/
          retention-days: 2
