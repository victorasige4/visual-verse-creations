name: Temporary Potadot CTA visual reference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-about-cta.yml'
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install visual inspection browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture CTA anatomy, animation and button hover
        run: |
          cat > .inspect-about-cta.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('cta-reference', {recursive:true});
          const browser=await chromium.launch({headless:true});
          const pages=[
            ['potadot','https://potadot.com.my/about-us/','Have a workflow that needs a system?'],
            ['visual-verse','http://127.0.0.1:5173/about.html',"Have a story?"]
          ];
          const viewports=[['desktop',1440,960],['mobile',390,844]];
          for(const [company,url,title] of pages){
            for(const [viewport,width,height] of viewports){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1,reducedMotion:'no-preference'});
              const prefix='cta-reference/'+company+'-'+viewport;
              try{
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(2000);
                const heading=page.getByRole('heading',{name:new RegExp(title.replaceAll('?','\\?'),'i')}).first();
                await heading.scrollIntoViewIfNeeded({timeout:12000});
                await page.waitForTimeout(120);
                const el=heading.locator('xpath=ancestor::section[1]');
                const section=await el.count()?el:heading.locator('xpath=../..');
                const bb=await section.boundingBox();
                await section.screenshot({path:prefix+'-intro.png',animations:'allow',timeout:15000});
                await page.waitForTimeout(450);
                await section.screenshot({path:prefix+'-mid.png',animations:'allow',timeout:15000});
                await page.waitForTimeout(1400);
                await section.screenshot({path:prefix+'-settled.png',animations:'disabled',timeout:15000});
                const data=await section.evaluate(root=>{
                  const rootRect=root.getBoundingClientRect();
                  const style=(node)=>{
                    const rect=node.getBoundingClientRect();const css=getComputedStyle(node);
                    return {tag:node.tagName,cls:typeof node.className==='string'?node.className.slice(0,130):'',
                      text:node.textContent?.trim().slice(0,135),
                      x:Math.round(rect.x-rootRect.x),y:Math.round(rect.y-rootRect.y),w:Math.round(rect.width),h:Math.round(rect.height),
                      fontSize:css.fontSize,fontFamily:css.fontFamily,fontWeight:css.fontWeight,lineHeight:css.lineHeight,
                      letterSpacing:css.letterSpacing,color:css.color,background:css.background,backgroundColor:css.backgroundColor,
                      border:css.border,borderRadius:css.borderRadius,padding:css.padding,margin:css.margin,gap:css.gap,
                      display:css.display,gridTemplateColumns:css.gridTemplateColumns,position:css.position,
                      overflow:css.overflow,opacity:css.opacity,
                      transition:css.transition,animation:css.animation,transform:css.transform,boxShadow:css.boxShadow,
                      willChange:css.willChange,
                    };
                  };
                  const interesting=Array.from(root.querySelectorAll('h1,h2,h3,p,a,button,svg,img,span,small,strong,div'))
                    .filter(n=>{const r=n.getBoundingClientRect();return r.width>20&&r.height>8});
                  return {url:location.href,section:style(root),html:root.outerHTML.slice(0,105000),
                    elements:interesting.slice(0,160).map(style),frames:document.getAnimations().filter(a=>root.contains(a.effect?.target)).map(a=>({
                      currentTime:a.currentTime,playState:a.playState,timing:a.effect?.getComputedTiming()?.duration,
                      target:a.effect?.target?.outerHTML?.slice(0,280)
                    })).slice(0,80)};
                });
                fs.writeFileSync(prefix+'.json',JSON.stringify(data,null,2));
                console.log(prefix,JSON.stringify({section:data.section,elementCount:data.elements.length,buttons:data.elements.filter(x=>x.tag==='A'||x.tag==='BUTTON').slice(0,5)}));
                const anchors=section.locator('a,button');
                for(let i=0;i<Math.min(anchors.count?await anchors.count():0,5);i++){
                  const link=anchors.nth(i);
                  const box=await link.boundingBox();
                  if(!box||box.w<0)continue;
                  try{
                    await link.hover({force:true,timeout:5000});
                    await page.waitForTimeout(550);
                    await section.screenshot({path:prefix+'-hover-'+i+'.png',animations:'allow',timeout:15000});
                    const state=await link.evaluate(el=>({
                      html:el.outerHTML.slice(0,4000),style:getComputedStyle(el).cssText,
                      rect:{width:el.getBoundingClientRect().width,height:el.getBoundingClientRect().height},
                      animations:el.getAnimations({subtree:true}).map(a=>({name:a.animationName,currentTime:a.currentTime,playState:a.playState}))
                    }));
                    fs.writeFileSync(prefix+'-hover-'+i+'.json',JSON.stringify(state,null,2));
                  }catch(e){console.log('hover error',String(e));}
                }
              }catch(e){fs.writeFileSync(prefix+'-error.txt',String(e));console.log(prefix,'ERROR',String(e));}
              await page.close();
            }
          }
          await browser.close();
          JS
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/vv-cta-vite.log 2>&1 &
          sleep 3
          node .inspect-about-cta.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cta-reference
          path: cta-reference/
          retention-days: 2
