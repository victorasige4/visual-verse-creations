name: Temporary Aceternity 3D pin registry inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-aceternity-3d-pin.yml']
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Capture exact registry sources and check dependencies
        run: |
          mkdir -p pin-registry
          for name in 3d-pin-demo 3d-pin; do
            curl -fLsS --retry 3 "https://ui.aceternity.com/registry/$name.json" -o "pin-registry/$name.json" || true
          done
          python3 - <<'PY'
          import json, pathlib
          for path in pathlib.Path('pin-registry').glob('*.json'):
            j=json.loads(path.read_text())
            print('REGISTRY',path.name,'name',j.get('name'),'type',j.get('type'),'dependencies',j.get('dependencies'))
            for item in j.get('files',[]):
              print('  FILE',item.get('path'), 'target',item.get('target'), 'size',len(item.get('content','')))
              if item.get('content'):
                filepath=pathlib.Path('pin-registry')/path.stem/item.get('path','component.txt')
                filepath.parent.mkdir(exist_ok=True,parents=True)
                filepath.write_text(item['content'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aceternity-pin-registry
          path: pin-registry/
          retention-days: 1
